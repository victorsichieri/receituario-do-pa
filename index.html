<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b57">
<meta name="description" content="Prescrições e condutas de pronto atendimento separadas por queixa, para copiar e colar.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%;box-sizing:border-box}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Receituário do PA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: índice de queixas à esquerda, receita à direita (empilha no celular) */
:root{
  --bg:#f4f6f5; --panel:#ffffff; --ink:#18221f; --muted:#5d6b66; --line:#dbe2df;
  --accent:#1f6b57; --accent-soft:#e2efea; --warn:#9a5b12; --warn-soft:#fbf0de; --sel:#fff7d6;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --panel:#18201d; --ink:#e3ebe8; --muted:#93a39d; --line:#2a3531;
  --accent:#5fc0a1; --accent-soft:#1d3a31; --warn:#e3a95a; --warn-soft:#3a2d1a; --sel:#3a3418; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --panel:#18201d; --ink:#e3ebe8; --muted:#93a39d; --line:#2a3531;
  --accent:#5fc0a1; --accent-soft:#1d3a31; --warn:#e3a95a; --warn-soft:#3a2d1a; --sel:#3a3418; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
.app{display:flex;flex-direction:column;height:100%}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .rx{font-family:var(--f-mono);color:var(--accent);font-size:20px;font-weight:500}
.count{color:var(--muted);font-size:13px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;font:inherit;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;font:inherit;font-size:13px;font-weight:500;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0}
nav{border-right:1px solid var(--line);overflow-y:auto;padding-block:8px 24px;background:var(--panel)}
.group h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:14px 16px 4px}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;font-size:14px;background:none;border:0;padding:7px 16px;color:var(--ink);cursor:pointer;border-left:3px solid transparent}
.item:hover{background:var(--bg)}
.item.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.item .nm{flex:1;min-width:0}
.tag{flex:none;font-size:10px;font-weight:600;letter-spacing:.05em;padding:2px 6px;border-radius:4px;text-transform:uppercase}
.tag.rx{background:var(--accent-soft);color:var(--accent)}
.tag.al{background:var(--warn-soft);color:var(--warn)}
.tag.cd{background:var(--warn-soft);color:var(--warn)}
.star{color:var(--warn);font-size:12px}
.empty{padding:24px 16px;color:var(--muted)}
section.detail{overflow-y:auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.dwrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.back{display:none;font:inherit;font-size:14px;background:none;border:0;color:var(--accent);padding:0;cursor:pointer;align-self:flex-start}
.dhead{display:flex;flex-direction:column;gap:6px}
.meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
h1{font-size:22px;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:-20px;background:var(--bg);padding-block:8px;z-index:2}
.btn{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn:hover{filter:brightness(1.05)}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.blk{display:grid;grid-template-columns:34px 1fr 40px;align-items:start;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.blk.sel{background:var(--sel)}
.blk input{margin:14px 0 0 12px;width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.blk pre{margin:0;padding:11px 4px 11px 4px;font-family:var(--f-mono);font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;min-width:0;color:var(--ink)}
.blk pre .h{color:var(--accent);font-weight:500}
.cp{margin:6px 6px 0 0;border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px}
.cp:hover{background:var(--bg);color:var(--accent)}
.desc{position:relative;padding:10px 44px 10px 46px;border-bottom:1px solid var(--line);background:var(--bg)}
.desc:last-child{border-bottom:0}
.desc pre{margin:0;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--muted)}
.desc pre .h{color:var(--accent);font-weight:500}
.desc .cp{position:absolute;top:4px;right:0}
.desc.note pre{color:var(--ink)}
.blk pre{cursor:pointer}
.alarm{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;overflow:hidden}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);font-weight:600}
.alarm h2{font-size:15px;margin:2px 0 0;text-wrap:balance}
.apar{display:grid;grid-template-columns:1fr 40px;gap:4px;padding:10px 0 10px 14px;border-bottom:1px solid var(--line)}
.apar:last-child{border-bottom:0}
.apar p{margin:0;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;min-width:0;word-break:break-word}
.apar .cp{margin:0 6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:500;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fallback{width:100%;min-height:160px;font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);color:var(--ink)}
@media (max-width:760px){
  main{grid-template-columns:1fr}
  nav{border-right:0}
  main.showing nav{display:none}
  main:not(.showing) section.detail{display:none}
  .back{display:inline-block}
  .bar{top:-20px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>
<body>
<div class="app">
<header>
  <div class="top">
    <div class="brand"><span class="rx">℞</span> Receituário do PA</div>

    <label class="search" for="q">

const DATA = {"cats": ["Respiratório", "Cardio / Emergência", "Trauma / Feridas", "Metabólico", "Gastro", "Pele", "Olhos", "Gineco / IST / Uro", "Neuro / Psiq", "Dor / Sintomáticos", "Infecto"], "secs": [{"t": "XAROPES TOSSE PRODUTIVA", "b": "\n1) AMBROXOL - Expectorante.\n   TOMAR 10 AML DE 8/8 HORAS POR 05 DIAS.\n\n1) ACEBROFILINA XAROPE 10MG/ ML - Broncodilatador, mucolítico, expectorante\n   TOMAR 10 ML DE 12/12 HORAS POR 5 DIAS.\n\n1) ACETILCISTEINA 600MG - Mucolítico; antídoto\n    DILUIR 01 SACHE EM 200ML DE AGUA E TOMAR A NOITE POR 05 DIAS.\n\nTOSSE SECA:\n\n1) PERCOF - Antitussígeno\n    TOMAR 10ML DE 08/08H POR 05 DIAS.\n\n1) MALEATO DE DEXCLORFENIRAMINA + BETAMETASONA (KOIDE D) - Anti-histamínico; corticoide\n    TOMAR 10ML DE 08/08 HORAS POR 05 DIAS.\n\n1) CLORIDRATO DE CLOBUTINOL + SUCCINATO DE DOXILAMINA (HYTOS PLUS) - Antitussígeno; Anti-histamínico\n    TOMAR 10 ML DE 08/08 HORAS POR 05 DIAS.\n\n1) FENDIZOATO DE CLOPERASTINA XAROPE (SEKI) - Antitussígeno\n    TOMAR 05ML PELA MANHÃ, 05ML NO ALMOÇO E 10ML A NOITE.", "c": "Respiratório", "k": "rx", "al": {"n": "SÍNDROME GRIPAL/ IVAS", "p": ["ORIENTO SINAIS DE ALARME PARA RETORNO IMEDIATO: FALTA DE AR OU CANSAÇO PARA RESPIRAR, DOR NO PEITO, FEBRE PERSISTENTE POR MAIS DE 3 DIAS OU QUE RETORNA APÓS MELHORA, PROSTRAÇÃO IMPORTANTE, LÁBIOS OU EXTREMIDADES ARROXEADOS, CONFUSÃO MENTAL, REDUÇÃO DO VOLUME URINÁRIO. SEGUIMENTO: RETORNO EM 48-72H SE NÃO HOUVER MELHORA, SE NOVA PIORA DO QUADRO APÓS MELHORA PARCIAL DO QUADRO OU ANTES SE SINAIS DE ALARME. PACIENTE ORIENTADO E CIENTE.", "EXPLICADO O DIAGNÓSTICO DE SÍNDROME GRIPAL, DE CARÁTER AUTOLIMITADO, E O OBJETIVO SINTOMÁTICO DAS MEDICAÇÕES. PRESCRITO DIPIRONA 1G VO DE 6/6H SE DOR OU FEBRE E AUMENTO DA INGESTA HÍDRICA. ORIENTADO REPOUSO RELATIVO, HIDRATAÇÃO ABUNDANTE, ALIMENTAÇÃO LEVE E LAVAGEM NASAL COM SORO FISIOLÓGICO. REFORÇADO QUE ANTIBIÓTICO NÃO ESTÁ INDICADO NESTE MOMENTO POR SE TRATAR DE QUADRO VIRAL."]}}, {"t": "HEMORRAGIA DIGESTIVA BAIXA", "b": "EXPANSÃO };
const HDR=/^\s*(USO\b[^\n]*|PRESCRIÇÃO|ANAMNESE|CASA:?|HIPERTENSIVO|NÃO HIPERTENSIVO|K\s*[<>][^\n]*|REPOSIÇÃO[^\n]*|ANALISAR[^\n]*|MONITORAR[^\n]*|PREVENÇÃO[^\n]*|OU|ORIENTAÇ[^\n]*|OBSERVAÇ[^\n]*|ATENÇÃO[^\n]*|ESQUEMA[^\n]*|OPÇÕES[^\n]*|\(I+\)[^\n]*|[^\n]{1,80}:\s*(\([^)]*\))?)\s*$/;
const BUL=/^\s*(\d+\s*[)\-]\s?|•|-\s|👉)/;
const VERB=/\b(TOMAR|APLICAR|ADMINISTRAR|INALAR|USAR|PINGAR|UTILIZAR|DILUIR|DILUIÇÃO|LAVAR|INICIAR COM|DAR|FAZER|MASTIGAR|CORRER)\b/;
const UNIT=/\d\s*(MG|ML|UI|G|MCG|%)\b|\bAMP(OLA)?S?\b|\bCAIXA\b|\bFRASCO\b|\bTUBO\b|\bCOMPRIMIDOS?\b/i;
const ROUTE=/\b(IM|EV|IV|VO|SC|SL)\b/;
const NOTEH=/^\s*(ORIENTAÇ|OBSERVAÇ|ATENÇÃO|OBS\b)/;
const PROT=/^\s*(-\s*)?(VERIFICAR|SOLICITAR|CHECAR|MONITORAR|MEDIR|ANALISAR)\b/;
function isMed(t){
  if(PROT.test(t))return false;
  if(/^\s*👉/.test(t)&&!(VERB.test(t)||ROUTE.test(t)))return false;
  const bullet=BUL.test(t), unit=UNIT.test(t), verb=VERB.test(t), route=ROUTE.test(t);
  return (bullet&&(verb||unit))||(verb&&unit)||(unit&&route&&t.split('\n').length<=3);
}
function splitBlocks(b){
  const raw=b.split(/\n\s*\n/).map(x=>x.replace(/^\n+|\n+$/g,'')).filter(Boolean);
  const pieces=[];
  raw.forEach(x=>{const ls=x.split('\n');
    while(ls.length>1&&HDR.test(ls[0])&&!BUL.test(ls[0])&&!(VERB.test(ls[0])&&UNIT.test(ls[0]))){pieces.push({t:ls.shift(),h:true})}
    const body=ls.join('\n');
    if(ls.length>1&&ls.every(l=>/^\s*(-\s|•|👉)/.test(l)))ls.forEach(l=>pieces.push({t:l}));
    else pieces.push({t:body,h:ls.length===1&&HDR.test(ls[0])&&!isMed(ls[0])});
  });
  let notes=false,route='';
  pieces.forEach(p=>{
    if(p.h){ if(NOTEH.test(p.t))notes=true; else if(/^\s*(USO|ESQUEMA|OPÇÕES|PRESCRIÇÃO|\(I|CASA)/.test(p.t))notes=false;
      if(/^\s*USO\b/.test(p.t))route=p.t.trim(); if(/^\s*(ESQUEMA|OPÇÕES|\(I)/.test(p.t))route=''; p.med=false; return}
    if(NOTEH.test(p.t))notes=true;
    p.med=!notes&&isMed(p.t); p.route=route; p.note=notes;
  });
  return pieces;
}

  const b=document.createElement('button');b.className='chip';b.textContent=c;b.dataset.c=c;
  b.onclick=()=>{state.cat=c;store.set('rx_cat',c);renderChips();renderList()};chipsEl.appendChild(b)});
function renderChips(){chipsEl.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===state.cat))}

function filtered(){
  const words=norm(state.q).split(/\s+/).filter(Boolean);
  return DATA.secs.filter(s=>{
    if(state.cat==='★ Favoritas'&&!favs.has(s.t))return false;
    if(state.cat!=='Todas'&&state.cat!=='★ Favoritas'&&s.c!==state.cat)return false;
    return words.every(w=>s.norm.includes(w));
  });
}
function renderList(){
  const L=$('#list');L.innerHTML='';const arr=filtered();
  $('#count').textContent=arr.length+' de '+DATA.secs.length;
  if(!arr.length){L.innerHTML='<div class="empty">'+(state.cat==='★ Favoritas'&&!state.q?'Nenhuma favorita ainda. Abra uma receita e toque em ☆ Favoritar.':'Nada encontrado para essa busca.')+'</div>';return}
  const cats=state.q||state.cat==='Todas'||state.cat==='★ Favoritas'?DATA.cats:[state.cat];
  cats.forEach(c=>{const g=arr.filter(s=>s.c===c);if(!g.length)return;
    const d=document.createElement('div');d.className='group';d.innerHTML='<h3>'+c+'</h3>';
    g.forEach(s=>{const b=document.createElement('button');b.className='item'+(state.cur===s.id?' on':'');
      b.innerHTML=(favs.has(s.t)?'<span class="star">★</span>':'')+'<span class="nm"></span>'+(s.al?'<span class="tag al" title="Tem sinais de alarme">!</span>':'')+'<span class="tag '+s.k+'">'+(s.k==='rx'?'Receita':'Conduta')+'</span>';
      b.querySelector('.nm').textContent=s.t;b.onclick=()=>open(s.id,true);d.appendChild(b)});
    L.appendChild(d)});
}
function fmt(t){return state.compact?t.replace(/\s*[-–—_]{4,}\s*/g,' — ').replace(/ — $/gm,''):t}
function esc(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function hl(t){return esc(t).split('\n').map(l=>/^(USO [A-ZÁÉÍÓÚÇÃÕ ()]+|ORIENTAÇ[ÕO]ES?|OBSERVAÇÃO|PRESCRIÇÃO|ANAMNESE|PS|CASA|PRONTO ATENDIMENTO)\s*:?/.test(l.trim())&&l.length<60?'<span class="h">'+l+'</span>':l).join('\n')}

function open(id,scroll){
  state.cur=id;state.sel=new Set();const s=DATA.secs[id];
  $('#main').classList.add('showing');
  const D=$('#detail');
  D.innerHTML=`<div class="dwrap">
    <button class="back" id="back">← Voltar à lista</button>
    <div class="dhead"><div class="meta"><span class="tag ${s.k}">${s.k==='rx'?'Receita':'Conduta / protocolo'}</span><span>${s.c}</span></div><h1></h1></div>
    <div class="bar">
      <button class="btn primary" id="cpAll"></button>
      <button class="btn" id="fav"></button>
      <label class="toggle" for="compact"><input type="checkbox" id="compact" ${state.compact?'checked':''}> Remover tracejados</label>
    </div>
    <div class="hint">Marque os medicamentos e copie só eles (a via, como USO ORAL, entra junto). Textos de apoio ficam como descrição.</div>
    <div class="sheet" id="sheet"></div>
    <div id="alarm"></div>
  </div>`;
  D.querySelector('h1').textContent=s.t;
  const sh=$('#sheet');
  const P=s.pieces; let i=0;
  const cpIcon='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
  while(i<P.length){
    if(P[i].med){const idx=i,p=P[i];const r=document.createElement('div');r.className='blk';
      r.innerHTML=`<input type="checkbox" id="b${idx}" aria-label="Selecionar medicamento"><pre>${esc(fmt(p.t))}</pre><button class="cp" title="Copiar este medicamento" aria-label="Copiar este medicamento">${cpIcon}</button>`;
      r.querySelector('input').onchange=e=>{e.target.checked?state.sel.add(idx):state.sel.delete(idx);r.classList.toggle('sel',e.target.checked);upd()};
      r.querySelector('pre').onclick=()=>{const c=r.querySelector('input');c.checked=!c.checked;c.onchange({target:c})};
      r.querySelector('.cp').onclick=()=>copy(fmt(p.t),'Medicamento copiado');
      sh.appendChild(r);i++;continue}
    const grp=[];while(i<P.length&&!P[i].med){grp.push(P[i]);i++}
    const g=document.createElement('div');g.className='desc';
    const isNote=grp.some(p=>p.note||/^\s*(ORIENTAÇ|OBSERVAÇ|ATENÇÃO)/.test(p.t));
    g.innerHTML='<pre>'+grp.map(p=>p.h?'<span class="h">'+esc(fmt(p.t))+'</span>':esc(fmt(p.t))).join('\n')+'</pre>'+(isNote?`<button class="cp" title="Copiar orientações" aria-label="Copiar orientações">${cpIcon}</button>`:'');
    if(isNote){g.classList.add('note');const txt=grp.map(p=>fmt(p.t)).join('\n');g.querySelector('.cp').onclick=()=>copy(txt,'Orientações copiadas')}
    sh.appendChild(g);
  }
  if(s.al){const A=$('#alarm');A.className='alarm';
    A.innerHTML=`<div class="ahead"><div><div class="eyebrow">Para o prontuário</div><h2>Sinais de alarme e orientações · ${esc(s.al.n)}</h2></div><button class="btn" id="cpAl">Copiar ambos</button></div>`;
    s.al.p.forEach((p,k)=>{const r=document.createElement('div');r.className='apar';
      r.innerHTML=`<p>- ${esc(p)}</p><button class="cp" title="Copiar este parágrafo" aria-label="Copiar este parágrafo">${cpIcon}</button>`;
      r.querySelector('.cp').onclick=()=>copy('- '+p,'Parágrafo copiado');A.appendChild(r)});
    $('#cpAl').onclick=()=>copy(s.al.p.map(p=>'- '+p).join('\n'),'Sinais de alarme copiados');}
  function upd(){$('#cpAll').textContent=state.sel.size?`Copiar ${state.sel.size} selecionado${state.sel.size>1?'s':''}`:'Copiar receita inteira';
    $('#fav').textContent=favs.has(s.t)?'★ Favorita':'☆ Favoritar'}
  upd();
  $('#cpAll').onclick=()=>{
    if(!state.sel.size){copy(fmt(s.t+'\n\n'+s.b),'Receita copiada');return}
    let last=null;const out=[];
    [...state.sel].sort((a,b)=>a-b).forEach(k=>{const p=P[k];if(p.route&&p.route!==last){out.push(p.route);last=p.route}out.push(fmt(p.t))});
    copy(out.join('\n\n'),'Medicamentos copiados')};
  $('#fav').onclick=()=>{favs.has(s.t)?favs.delete(s.t):favs.add(s.t);store.set('rx_favs',[...favs]);upd();renderList()};
  $('#compact').onchange=e=>{state.compact=e.target.checked;store.set('rx_compact',state.compact);open(id,false)};
  $('#back').onclick=()=>{$('#main').classList.remove('showing')};
  if(scroll)D.scrollTop=0;
  renderList();
}
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600)}
function copy(txt,msg){
  const done=()=>toast(msg);
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();
    if(ok)done();else{const s=$('#sheet');const f=document.createElement('textarea');f.className='fallback';f.value=txt;s.before(f);f.select();toast('Selecione e copie manualmente (Ctrl+C)')}};
  try{navigator.clipboard.writeText(txt).then(done,fb)}catch(e){fb()}
}
$('#q').addEventListener('input',e=>{state.q=e.target.value;renderList()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus()}});
if(!['★ Favoritas','Todas',...DATA.cats].includes(state.cat))state.cat='Todas';
renderChips();renderList();
if(window.matchMedia('(min-width:761px)').matches){const f=filtered()[0];if(f)open(f.id,false)}
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
